# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bin_qc"
description: Quality assessment of metagenomic bins using BUSCO, CheckM, CheckM2, and GUNC
keywords:
  - quality control
  - bins
  - metagenomics
  - busco
  - checkm
  - checkm2
  - gunc
components:
  - busco/busco
  - checkm2/databasedownload
  - checkm/qa
  - checkm/lineagewf
  - checkm2/predict
  - gunc/downloaddb
  - gunc/run
  - gunc/mergecheckm
  - qsv/cat
  - untar
input:
  - ch_bins:
      description: Metagenomic bins in FASTA format
      structure:
        - meta:
            type: map
            description: Metadata map
        - fasta:
            type: file
            description: Metagenomic bins in FASTA format
            pattern: "*.{fasta,fa}"
  - min_completeness:
      type: value
      description: Minimum completeness (%) a tool's reading must clear for a bin to be preferred for dereplication.
  - max_contamination:
      type: value
      description: Maximum contamination (%) a tool's reading must clear for a bin to be preferred for dereplication.
output:
  - qc_summary:
      description: Combined quality assessment summary
      structure:
        - meta:
            type: map
            description: Metadata map
        - tsv:
            type: file
            description: Quality assessment summary in TSV format
            pattern: "*.tsv"
  - genome_info:
      description: |
        Study-wide "genome,completeness,contamination" table (dRep's
        genome_info format) built from whichever of BUSCO/CheckM/CheckM2 ran,
        for use as Galah's dereplication input. When more than one tool
        assessed a bin, whichever tool's own reading clears the dereplication
        thresholds is preferred (mirrors GTDB-Tk's any-tool-passes bin
        filter); CheckM2 > CheckM > BUSCO priority only breaks a tie among
        passing readings, or applies when none of them pass.
      structure:
        - csv:
            type: file
            description: genome_info table
            pattern: "*.csv"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - multiqc_files:
      description: MultiQC files for quality control statistics
      structure:
        - meta:
            type: map
            description: Metadata map
        - "*":
            type: file
            description: MultiQC report files
            pattern: "*"
authors:
  - "@dialvarezs"
maintainers:
  - "@jfy133"
  - "@prototaxites"
  - "@dialvarezs"
  - "@d4straub"
  - "@muabnezor"
